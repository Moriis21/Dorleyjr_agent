name: Dorley-WhatsApp-Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"   # Runs every 10 minutes to keep bot alive

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install

      - name: Run WhatsApp Bot
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          NODE_ENV: production
        run: |
          echo "Starting Morris WhatsApp Bot..."
          node index.js
